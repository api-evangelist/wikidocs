aid: wikidocs
name: Wikidocs
description: >-
  Wikidocs was a real-time collaboration startup (wikidocs.io) that built a
  framework for turning any web page into a live, editable, multi-user "docs"
  service — enabling real-time content creation, editing, and sharing directly
  in the browser without waiting for updated versions. Backed by Speedinvest,
  the company was acquired by Atlassian in September 2014 and its collaboration
  technology was folded into Atlassian's products. Wikidocs no longer operates
  as an independent product: its former domain, wikidocs.io, is now a parked and
  email-forwarded registrar domain with no live developer portal, API,
  documentation, or machine-readable surface to enrich.
